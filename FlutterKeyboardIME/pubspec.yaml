name: flutter_keyboard_ime
description: A complete Flutter-based Android keyboard (Input Method Editor) with full system integration

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI and Material Design
  cupertino_icons: ^1.0.2
  
  # Local storage for preferences
  shared_preferences: ^2.2.2
  
  # State management
  provider: ^6.1.1
  
  # Utilities
  path_provider: ^2.1.1
  
  # Platform integration
  flutter/services:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Enable embedding for keyboard service
  plugin:
    platforms:
      android:
        package: com.example.flutter_keyboard_ime
        pluginClass: FlutterKeyboardPlugin

  assets:
    - assets/fonts/

  fonts:
    - family: KeyboardFont
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500